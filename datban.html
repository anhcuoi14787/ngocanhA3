<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt bàn nhà hàng</title>
     <style>
        body { font-family: Arial, Helvetica, sans-serif; background: #fafafa; margin: 0; padding: 24px;}
        form { max-width: 480px; margin: 0 auto; background: #fff; padding: 20px 24px ; border-radius: 8px;}
        fieldset { border: 1px solid #ddd;border-radius: 6px ; padding: 16px 20px;}
        legend { font-weight: bold; padding: 0 8px;}
        label { font-weight: bold;}
        input, textarea { width: 100%; padding: 8px; margin-top:4px ;box-sizing: border-box; border: 1px solid #ccc;border-radius: 4px;}
        p {margin: 14px 0;}
        button { width: 100%; padding: 12px; margin-top: 16px;background: #3498db; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer;}
        button:hover { background: #2980b9;}
        meter {width: 100%; height: 22px;}
        -ghi-chu-ban {font-size: 14px; color: #555;}


    </style>
</head>
<body>
    <h1 style="text-align: center;">Đặt bàn nhà hàng </h1>
    <form action="#" method="post">
        <fieldset>
            <legend>Thông tin đặt bàn</legend>
            <p>
                <label for="hoten">Họ và tên: <span style="color: red;">*</span></label>
                <input type="text" id="hoten" name="hoten" placeholder="Nguyễn Văn A" required autofocus>

            </p>
            <p>
                <label for="phone">Số điện thoại: <span style="color: red;">*</span> </label>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" title="Nhập đúng 10 số điện thoại " placeholder="0925432547" required>


            </p>
            <p>
                <label for="ngaydat">Ngày đặt bàn <span style="color: red;"></span></label>
                <input type="date" id="ngaydat" name="ngaydat" min="2026-08-18">
            </p>
            <p>
                <label for="giodat">Giờ đặt bàn <span style="color: red;"></span></label><br>
                <input type="time" name="giodat" id="giodat" min="10:00" max="22:00" required>
            </p>
            <p>
                <label for="soluong">Số lượng khách </label><br>
                <input type="number" name="soluong" id="soluong" min="1" max="20" value="2">

            </p>
            <p>
                <label for="banconso">Số bàn còn trống hôm nay </label><br>
                <meter id="banconso" value="5" min="0" max="20" low="5" high="15" optimum="20">5/20 bàn</meter>
                <p class="ghi-chu-ban">5/20 bàn - nên đặt sớm nấu đi vào giờ coa điểm</p>
            </p>
            <p>
                <label for="yeucau">Yêu cầu đặc biệt</label>
                <textarea name="yeucau" id="yeucau" rows="3" placeholder="Ví dụ: BÀn gần cửa sổ,bàn có ghế trẻ em ,..."></textarea>
            </p>
        </fieldset>
        <button type="submit">Xác nhận đặt bàn</button>
    </form>
</body>
</html>
